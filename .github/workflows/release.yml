name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="snapi-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}"
          BIN="snapi"
          [ "${{ matrix.goos }}" = "windows" ] && BIN="snapi.exe"
          mkdir "$NAME"
          go build -ldflags "-s -w" -o "$NAME/$BIN" ./cmd/snapi
          if [ "${{ matrix.goos }}" = "windows" ]; then
            (cd "$NAME" && zip -r "../${NAME}.zip" .)
          else
            tar -czf "${NAME}.tar.gz" "$NAME"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: snapi-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            snapi-*.tar.gz
            snapi-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
